name: CI & Release (IceDragon App Hub)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          v="$(sed -n 's/^version:[[:space:]]*\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' pubspec.yaml)"
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-pub

      - name: Flutter test
        run: flutter test --no-pub --reporter expanded

  build-debug:
    needs: verify
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build debug APK (PR check)
        run: |
          flutter pub get
          flutter build apk --debug

  build-apk:
    needs: verify
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    outputs:
      signed_sha256: ${{ steps.keystore.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Require & verify release keystore
        id: keystore
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Missing required ANDROID_KEYSTORE_BASE64 or ANDROID_KEYSTORE_PASSWORD secret. Refusing release build without dedicated signing keystore."
            exit 1
          fi

          printf '%s' "$KEYSTORE" | tr -d '\r\n ' | base64 -d > android/release.jks
          cert_info="$(keytool -list -v -keystore android/release.jks -storepass "$PASSWORD" -alias release)"
          expected_sha256="$(printf '%s\n' "$cert_info" | sed -nE 's/.*SHA-?256:[[:space:]]*([0-9A-Fa-f:]+).*/\1/p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ "${#expected_sha256}" -ne 64 ]; then
            echo "::error::Failed to extract SHA-256 certificate fingerprint from release keystore."
            exit 1
          fi

          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=release\nkeyPassword=%s\n' "$PASSWORD" "$PASSWORD" > android/key.properties
          echo "sha256=$expected_sha256" >> "$GITHUB_OUTPUT"

      - name: Build release APKs
        run: |
          set -euo pipefail
          flutter pub get
          mkdir -p out
          flutter build apk --release --split-per-abi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "out/IceDragon-AppHub-$abi.apk"
          done
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk out/IceDragon-AppHub-universal.apk

      - name: Verify APK signatures & SHA-256 certificates
        shell: bash
        env:
          EXPECTED_SHA256: ${{ steps.keystore.outputs.sha256 }}
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          apksigner_bin="$(find "$sdk_root/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [ ! -x "$apksigner_bin" ]; then
            echo "::error::apksigner tool not found under $sdk_root/build-tools"
            exit 1
          fi

          for apk in out/IceDragon-AppHub-arm64-v8a.apk out/IceDragon-AppHub-armeabi-v7a.apk out/IceDragon-AppHub-x86_64.apk out/IceDragon-AppHub-universal.apk; do
            test -f "$apk"
            echo "=== Verifying $apk ==="
            cert_out="$("$apksigner_bin" verify --verbose --print-certs "$apk")"
            printf '%s\n' "$cert_out"
            if ! printf '%s\n' "$cert_out" | grep -q '^Number of signers: 1$'; then
              echo "::error::Expected exactly 1 signer certificate for $apk"
              exit 1
            fi
            actual_sha256="$(printf '%s\n' "$cert_out" | sed -nE 's/.*certificate SHA-256 digest:[[:space:]]*([0-9A-Fa-f:]+).*/\1/p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            if [ -z "$actual_sha256" ] || [ "$actual_sha256" != "$EXPECTED_SHA256" ]; then
              echo "::error::Certificate SHA-256 mismatch for $apk (expected $EXPECTED_SHA256, got ${actual_sha256:-empty})"
              exit 1
            fi
          done
          echo "Verified release signing certificate SHA-256 across all built APKs." >> "$GITHUB_STEP_SUMMARY"

      - name: Clean keystore files
        if: always()
        run: rm -f android/release.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: icedragon-app-hub-apks
          path: out/*.apk
          if-no-files-found: error

  release:
    needs: [verify, build-apk]
    if: ${{ !failure() && !cancelled() && github.event_name != 'pull_request' && needs.build-apk.outputs.signed_sha256 != '' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: icedragon-app-hub-apks
          path: release

      - name: Checksums & publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release
        run: |
          set -euo pipefail
          v="${{ needs.verify.outputs.version }}"
          tag="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            tag="v$v"
          fi
          sha256sum IceDragon-AppHub-*.apk > SHA256SUMS.txt
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" ./* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" ./* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "IceDragon App Hub $v" \
              --generate-notes
          fi
