name: CI & Release (IceDragon App Hub)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          v="$(sed -n 's/^version:[[:space:]]*\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' pubspec.yaml)"
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-pub

      - name: Flutter test
        run: flutter test --no-pub --reporter expanded

  build-apk:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Optional release keystore
        id: keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$PASSWORD" ]; then
            printf '%s' "$KEYSTORE" | tr -d '\r\n ' | base64 -d > android/release.jks
            keytool -list -keystore android/release.jks -storepass "$PASSWORD" -alias release >/dev/null
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=release\nkeyPassword=%s\n' "$PASSWORD" "$PASSWORD" > android/key.properties
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 or ANDROID_KEYSTORE_PASSWORD not set — falling back to debug signing."
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APKs
        run: |
          flutter pub get
          mkdir -p out
          flutter build apk --release --split-per-abi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "out/IceDragon-AppHub-$abi.apk"
          done
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk out/IceDragon-AppHub-universal.apk
          keytool -printcert -jarfile out/IceDragon-AppHub-universal.apk | head -n 12 || true
          echo "Signing mode: ${{ steps.keystore.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean keystore files
        if: always()
        run: rm -f android/release.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: icedragon-app-hub-apks
          path: out/*.apk
          if-no-files-found: error

  release:
    needs: [verify, build-apk]
    if: ${{ !failure() && !cancelled() && github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: icedragon-app-hub-apks
          path: release

      - name: Checksums & publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release
        run: |
          v="${{ needs.verify.outputs.version }}"
          tag="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            tag="v$v"
          fi
          sha256sum IceDragon-AppHub-*.apk > SHA256SUMS.txt
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" ./* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" ./* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "IceDragon App Hub $v" \
              --generate-notes
          fi
